services:
  bot-postgres:
   image: postgres:18-bookworm 
   container_name: bot-env-postgres
   environment:
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_DB=${POSTGRES_DB}
   volumes:
    - ./out/pgdata:/var/lib/postgresql
   ports:
   - "5432:5432" #Временно не для деплоя 
   restart: always
   healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot-mysql:
    image: mysql:8.0 
    container_name: bot-env-mysql
    environment:
    - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    - MYSQL_DATABASE=${MYSQL_DATABASE}
    - MYSQL_USER=${MYSQL_USER}
    - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
    - ./out/mysqldata:/var/lib/mysql
    ports:
    - "3306:3306" #Временно не для деплоя 
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bot-sqlite:
    image: nouchka/sqlite3:latest
    container_name: bot-env-sqlite
    volumes:
      - ./out/sqlitedata:/data
    stdin_open: true
    tty: true
    command: ["/data/database.db"]
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    healthcheck:
      test: ["CMD", "sqlite3", "/data/database.db", "SELECT 1;"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4
    container_name: go-cash-redis
    ports:
      - "6379:6379"
    volumes:
      - ./out/redisdata:/data
    environment:
      - MAX_MEMORY=${MAX_MEMORY:-100mb}
    command:
      - redis-server
      - --maxmemory-policy
      - allkeys-lru
      - --maxmemory
      - ${MAX_MEMORY}
      
  telegram-bot:
    image: telegram-bot
    pull_policy: never
    container_name: bot-telegram
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      bot-postgres:
        condition: service_healthy
    restart: always
   
  bot-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
    - ./migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: bot-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:bot-postgres:5432
    ports:
    - "127.0.0.1:5432:5432"